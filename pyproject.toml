[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webtracker"
version = "0.1.0"
description = "A flexible web tracking notification system"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "apscheduler>=3.10,<4",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
webtracker = "webtracker.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/webtracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
